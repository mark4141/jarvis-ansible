---
- name: Ubuntu Server home lab
  hosts: homelab
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [always]
    - role: docker
      tags: [always]
    - role: bambuddy
      tags: [bambuddy]
    - role: pihole
      tags: [pihole]
    - role: nextcloud
      tags: [nextcloud]
    - role: jellyfin
      tags: [jellyfin]
    - role: homeassistant
      tags: [homeassistant]
  post_tasks:
    - name: Show URLs
      ansible.builtin.debug:
        msg:
          - "Home Assistant: http://192.168.2.43:8123"
          - "Bambuddy:       http://192.168.2.43:8000"
          - "Jellyfin:       http://192.168.2.43:8096"
          - "Nextcloud:      http://192.168.2.43:8080"
          - "Pi-hole:        http://192.168.2.43/admin"
