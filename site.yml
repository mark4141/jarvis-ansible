---
- name: Jarvis home lab
  hosts: homelab
  become: true
  vars_files:
    - group_vars/vault.yml
  roles:
    - { role: common, tags: [always] }
    - { role: docker, tags: [always] }
    - { role: pihole, tags: [pihole] }
    - { role: homeassistant, tags: [homeassistant] }
    - { role: bambuddy, tags: [bambuddy] }
    - { role: jellyfin, tags: [jellyfin, media] }
    - { role: jellyseerr, tags: [jellyseerr, media] }
    - { role: sonarr, tags: [sonarr, media] }
    - { role: radarr, tags: [radarr, media] }
    - { role: prowlarr, tags: [prowlarr, media] }
    - { role: qbittorrent, tags: [qbittorrent, media] }
    - { role: mediasorter, tags: [mediasorter, media] }
    - { role: immich, tags: [immich] }
    - { role: paperless, tags: [paperless] }
    - { role: mealie, tags: [mealie] }
    - { role: vaultwarden, tags: [vaultwarden] }
    - { role: uptime_kuma, tags: [uptime-kuma] }
    - { role: homepage, tags: [homepage] }
    - { role: watchtower, tags: [watchtower] }
    - { role: frigate, tags: [frigate] }        # frigate_state: stopped
    - { role: nextcloud, tags: [nextcloud] }    # nextcloud_state: stopped
    - { role: host_extras, tags: [host] }
