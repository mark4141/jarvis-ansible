[homelab]
# Beelink Mini S12 (jarvis) — live server since Oct 12 2026
jarvis ansible_host=192.168.2.43 ansible_user=thor4141 homelab_data_disk=/dev/sda

[homelab:vars]
# Ubuntu 26.04 ships sudo-rs; Ansible's become prompt detection needs classic sudo
ansible_become_exe=sudo.ws
ansible_python_interpreter=/usr/bin/python3
# To run the playbook on the server itself instead, add: ansible_connection=local
