---
- name: Create watchtower directory
  ansible.builtin.file:
    path: "{{ watchtower_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Template watchtower compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ watchtower_dir }}/docker-compose.yml"
    mode: "0644"

- name: Template watchtower .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ watchtower_dir }}/.env"
    mode: "0600"
  when: watchtower_env | default({}) | length > 0

- name: Start watchtower
  community.docker.docker_compose_v2:
    project_src: "{{ watchtower_dir }}"
    state: "{{ watchtower_state | default('present') }}"
