---
- name: Create Home Assistant directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ homeassistant_dir }}"
    - "{{ homeassistant_dir }}/config"
    - "{{ homeassistant_dir }}/config/custom_components"
    - "{{ homeassistant_dir }}/config/packages"

- name: Render Home Assistant Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ homeassistant_dir }}/docker-compose.yml"
    mode: "0644"

- name: Install jarvis hub package
  ansible.builtin.template:
    src: packages/jarvis.yaml.j2
    dest: "{{ homeassistant_dir }}/config/packages/jarvis.yaml"
    mode: "0644"

- name: Ensure configuration.yaml exists
  ansible.builtin.copy:
    dest: "{{ homeassistant_dir }}/config/configuration.yaml"
    content: |
      default_config:

      homeassistant:
        packages: !include_dir_named packages
    force: false
    mode: "0644"

- name: Install Grok conversation custom component
  ansible.builtin.git:
    repo: https://github.com/braytonstafford/grok_conversation.git
    dest: /tmp/grok_conversation
    version: master
    force: true

- name: Copy Grok conversation into HA config
  ansible.builtin.copy:
    src: /tmp/grok_conversation/custom_components/grok_conversation
    dest: "{{ homeassistant_dir }}/config/custom_components/grok_conversation"
    remote_src: true

- name: Install Jarvis system prompt
  ansible.builtin.copy:
    src: jarvis_prompt.txt
    dest: "{{ homeassistant_dir }}/config/jarvis_prompt.txt"
    mode: "0644"

- name: Start Home Assistant
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ homeassistant_dir }}"
  register: out
  changed_when: "'Started' in out.stderr or 'Created' in out.stderr or 'Recreate' in out.stderr"
