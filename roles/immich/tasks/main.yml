---
- name: Create immich directory
  ansible.builtin.file:
    path: "{{ immich_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Template immich compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_dir }}/docker-compose.yml"
    mode: "0644"

- name: Template immich .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ immich_dir }}/.env"
    mode: "0600"
  when: immich_env | default({}) | length > 0

- name: Pull images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ immich_dir }}"
  when: homelab_pull_images | default(true) | bool

- name: Start immich
  community.docker.docker_compose_v2:
    project_src: "{{ immich_dir }}"
    state: "{{ immich_state | default(homelab_apps_state | default('present')) }}"
