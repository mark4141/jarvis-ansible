---
- name: Create paperless directory
  ansible.builtin.file:
    path: "{{ paperless_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Template paperless compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ paperless_dir }}/docker-compose.yml"
    mode: "0644"

- name: Template paperless .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ paperless_dir }}/.env"
    mode: "0600"
  when: paperless_env | default({}) | length > 0

- name: Pull images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ paperless_dir }}"
  when: homelab_pull_images | default(true) | bool

- name: Start paperless
  community.docker.docker_compose_v2:
    project_src: "{{ paperless_dir }}"
    state: "{{ paperless_state | default(homelab_apps_state | default('present')) }}"
