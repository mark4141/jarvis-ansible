---
- name: Create Jellyfin directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ jellyfin_dir }}"
    - "{{ jellyfin_dir }}/config"
    - "{{ jellyfin_dir }}/cache"
    - "{{ jellyfin_media_dir }}"

- name: Render Jellyfin Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jellyfin_dir }}/docker-compose.yml"
    mode: "0644"

- name: Pull jellyfin images
  ansible.builtin.command:
    cmd: docker compose pull -q
    chdir: "{{ jellyfin_dir }}"
  changed_when: false
  when: homelab_pull_images | default(true) | bool

- name: Start Jellyfin
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ jellyfin_dir }}"
  register: jellyfin_up
  changed_when: "'Started' in jellyfin_up.stderr or 'Created' in jellyfin_up.stderr or 'Recreate' in jellyfin_up.stderr"
  when: (jellyfin_state | default(homelab_apps_state | default('present'))) != 'stopped'
