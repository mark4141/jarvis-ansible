---
- name: Create uptime-kuma directory
  ansible.builtin.file:
    path: "{{ uptime_kuma_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Template uptime-kuma compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ uptime_kuma_dir }}/docker-compose.yml"
    mode: "0644"

- name: Template uptime-kuma .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ uptime_kuma_dir }}/.env"
    mode: "0600"
  when: uptime_kuma_env | default({}) | length > 0

- name: Start uptime-kuma
  community.docker.docker_compose_v2:
    project_src: "{{ uptime_kuma_dir }}"
    state: "{{ uptime_kuma_state | default('present') }}"
