---
- name: Create radarr directory
  ansible.builtin.file:
    path: "{{ radarr_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Template radarr compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ radarr_dir }}/docker-compose.yml"
    mode: "0644"

- name: Template radarr .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ radarr_dir }}/.env"
    mode: "0600"
  when: radarr_env | default({}) | length > 0

- name: Start radarr
  community.docker.docker_compose_v2:
    project_src: "{{ radarr_dir }}"
    state: "{{ radarr_state | default('present') }}"
