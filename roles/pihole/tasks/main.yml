---
- name: Resolved.conf.d directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Create Pi-hole data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ pihole_data_dir }}"
    - "{{ pihole_data_dir }}/etc-pihole"
    - "{{ pihole_data_dir }}/etc-dnsmasq.d"

- name: Free port 53 from systemd-resolved stub listener
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/pihole.conf
    content: "[Resolve]\nDNSStubListener=no\n"
    mode: "0644"
  register: pihole_resolved_conf

- name: Point resolv.conf at real upstream file
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  when: pihole_resolved_conf.changed

- name: Render Pi-hole Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ pihole_data_dir }}/docker-compose.yml"
    mode: "0644"

- name: Pull pihole images
  ansible.builtin.command:
    cmd: docker compose pull -q
    chdir: "{{ pihole_data_dir }}"
  changed_when: false
  when: homelab_pull_images | default(true) | bool

- name: Start Pi-hole
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ pihole_data_dir }}"
  register: pihole_up
  changed_when: "'Started' in pihole_up.stderr or 'Created' in pihole_up.stderr or 'Recreate' in pihole_up.stderr"
  when: (pihole_state | default(homelab_apps_state | default('present'))) != 'stopped'
