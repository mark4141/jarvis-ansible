---
- name: Create Bambuddy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ bambuddy_dir }}"
    - "{{ bambuddy_dir }}/data"
    - "{{ bambuddy_dir }}/logs"

- name: Render Bambuddy Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ bambuddy_dir }}/docker-compose.yml"
    mode: "0644"

- name: Render Bambuddy env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ bambuddy_dir }}/.env"
    mode: "0640"

- name: Pull bambuddy images
  ansible.builtin.command:
    cmd: docker compose pull -q
    chdir: "{{ bambuddy_dir }}"
  changed_when: false
  when: homelab_pull_images | default(true) | bool

- name: Start Bambuddy
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ bambuddy_dir }}"
  register: bambuddy_up
  changed_when: "'Started' in bambuddy_up.stderr or 'Created' in bambuddy_up.stderr or 'Recreate' in bambuddy_up.stderr"
  when: (bambuddy_state | default(homelab_apps_state | default('present'))) != 'stopped'
