---
- name: Create Nextcloud directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ nextcloud_dir }}"
    - "{{ nextcloud_dir }}/html"
    - "{{ nextcloud_dir }}/data"
    - "{{ nextcloud_dir }}/db"
    - "{{ nextcloud_dir }}/redis"

- name: Render Nextcloud Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nextcloud_dir }}/docker-compose.yml"
    mode: "0600"

- name: Start Nextcloud stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ nextcloud_dir }}"
  register: nextcloud_up
  when: nextcloud_state | default('present') != 'stopped'
  changed_when: "'Started' in nextcloud_up.stderr or 'Created' in nextcloud_up.stderr or 'Recreate' in nextcloud_up.stderr"
