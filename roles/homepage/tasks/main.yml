---
- name: Create homepage directory
  ansible.builtin.file:
    path: "{{ homepage_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Template homepage compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ homepage_dir }}/docker-compose.yml"
    mode: "0644"

- name: Template homepage .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ homepage_dir }}/.env"
    mode: "0600"
  when: homepage_env | default({}) | length > 0

- name: Start homepage
  community.docker.docker_compose_v2:
    project_src: "{{ homepage_dir }}"
    state: "{{ homepage_state | default('present') }}"
